name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check + game structure check + build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test

      - name: Smoke test (all games end-to-end)
        run: npm run smoke
